<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Class -->
    <p><h1 class="first-class">This page will be styled with CSS</h1></p>

    <!-- Universal Selector -->
    <p>purple</p>

    <!-- Class, ID -->
    <p class="first-class" id="unique-id67"> big red text </p> <!-- "id" is the same as "class" except you can only have one per element -->
    
    <!-- Two IDs, but only one allowed(the first one) -->
    <p id="unique-id67" id="unique-id68"> I applied the id that makes text big and id that makes text magenta, but the second id is voided</p>

    <!-- Mutliple classes -->
    <p class="first-class backgroundcolor"> first-class AND backgroundcolor class turns this text red AND background auqa</p>

    <!-- The grouping selector -->
    <p class="blue-green-opacity">blue-green-opacity</p>
    <p class="blue-green-margin">blue-green-margin</p>

    <!-- Chaining selectors -->
     

</body>
</html>
