<!DOCTYPE html> <!--tells the browser what HTML verison we are using (HTML5)-->
<html lang = "en"> <!--root element of the document, meaning that every other element in the document will be a descendant of it-->
    <!--lang specifies the langugae content of the page. it is a type of "HTML attribute"-->
    <head> <!--we put "meta information" here, which is hidden information required for our webpage to render correctly in the browser, nothing that is actually displayed on the webpage-->
        <meta charset = "UTF-8"> <!--meta attributes dictates browser rendering, SEO, and social sharing-->
        <!--charset is a meta attribute that tells web browsers how the text in your document is encoded-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Odin Project Webpage</title> <!--shown on the Browser Tab and The bold, clickable headline when your page appears in search results-->
        
    </head>
    <!-- nesting and indentation: head and body are both "children" of the parent "html" element because they are at the same level of indentation-->
    <!-- you can see that every element inside body is a "child" of that body element -->
     
    <body> <!--Goes inside the html element but below the head. Easy!-->
        <!-- Headings -->
        <h1>Odin Project</h1>
        <br> <!-- Break element is a void element so it doesn't need a closing part-->
        <h1>This is a heading 1</h1>
        <h2>This is a heading 2</h2>
        <h3>This is a heading 3</h3>
        <h4>This is a heading 4</h4>
        <h5>This is a heading 5</h5>
        <h6>This is a heading 6</h6>

        <!-- Paragraphs -->
        <p><b>bold paragraph? </b>Paragraph 1</p> <!--bold element and strong element do the same thing-->
        <p><strong>strong paragraph? </strong>Paragraph 2</p>
        <p><em>emphasis element </em>Paragraph 3</p> <!--emphasis element makes things italicized-->

    </body>

</html>
